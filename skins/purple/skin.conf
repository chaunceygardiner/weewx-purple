# The page's language.  Set it in weewx.conf -- [StdReport]
# [[PurpleReport]] lang = de, or [[Defaults]] to switch every skin at once.
# That is the reliable place: weewx.conf is merged AFTER this file, and a
# stock WeeWX 5 weewx.conf already carries [[Defaults]] lang = en, which
# overrides a lang set here.  German, French, Dutch and Spanish ship:
# lang/de.conf, fr.conf, nl.conf, es.conf.
#
# No translatable value is repeated in this file -- not a label, not the
# year plot's x_label_format.  WeeWX merges this file back OVER the lang
# file, so a value repeated here would shadow the translation of any
# report whose lang is set HERE.  (A lang set in weewx.conf is merged
# after this file and was never affected.)
lang = en

[Extras]
    version = 7.2

###############################################################################

[Units]

    [[StringFormats]]

        # One decimal on the particulate readouts.  WeeWX's stock format for
        # this unit is whole numbers, which throws away the resolution that
        # makes the three sizes worth showing side by side: a clean day reads
        # 1, 3, 2 rather than 0.9, 3.0, 1.6.  No lang file sets this (a test
        # requires that skin.conf and the lang files never set the same
        # thing), and it is not translatable.
        microgram_per_meter_cubed = %.1f

###############################################################################

[CheetahGenerator]

    encoding = html_entities

    [[ToDate]]
        [[[index]]]
            template = index.html.tmpl

###############################################################################

[ImageGenerator]

    image_width = 500
    image_height = 230
    image_background_color = 0xffffff

    chart_background_color = 0xffffff
    chart_gridline_color = 0xd0d0d0

    # Setting to 2 or more might give a sharper image with fewer jagged edges
    anti_alias = 1

    # The skin's own OpenSans fonts (as in WeeWX's Seasons skin): WeeWX's
    # built-in bitmap font cannot draw the accented characters of the
    # translated plot labels.
    top_label_font_path = font/OpenSans-Bold.ttf
    top_label_font_size = 14

    unit_label_font_path = font/OpenSans-Bold.ttf
    unit_label_font_size = 12

    bottom_label_font_path = font/OpenSans-Regular.ttf
    bottom_label_font_size = 12

    axis_label_font_path = font/OpenSans-Regular.ttf
    axis_label_font_size = 10

    # Default colors for the plot lines. These can be overridden for
    # individual lines using option 'color'.  Every plot here draws a single
    # line, so only the first is ever used: it is 0xBBGGRR for #4a2d6b, the
    # purple the page's tabs and headings use.
    chart_line_colors = 0x6b2d4a, 0x4242b4, 0x42b442, 0xb4b442, 0xb442b4

    # Default fill colors for bar charts. These can be overridden for
    # individual bar plots using option 'fill_color'.
    chart_fill_colors = 0xc4b272, 0x7272c4, 0x72c472, 0xc4c472, 0xc472c4

    # Type of line. Options are 'solid' or 'none'.
    line_type = 'solid'

    # Size of marker in pixels
    marker_size = 8

    marker_type ='none'

    yscale = None, None, None

    # This controls whether day/night bands will be shown. They only look good
    # on plots wide enough to show individual days such as day and week plots.
    show_daynight = true
    # These control the appearance of the bands if they are shown.
    # Here's a monochrome scheme:
    daynight_day_color   = 0xfffafd
    daynight_night_color = 0xe2dfdf
    daynight_edge_color  = 0xd8d8e0
    # Here's an alternative, using a blue/yellow tint:
    #daynight_day_color   = 0xf8ffff
    #daynight_night_color = 0xfff8f8
    #daynight_edge_color  = 0xf8f8ff

    # Default plot parameters
    plot_type = line
    aggregate_type = none
    width = 1
    time_length = 86400 # 24 hours

    [[day_images]]
        x_label_format = %H:%M
        bottom_label_format = %x %X
        time_length = 97200 # 27 hours

        [[[dayaqi]]]
            [[[[pm2_5_aqi]]]]

        [[[daypm2_5]]]
            [[[[pm2_5]]]]

    [[week_images]]
        x_label_format = %d
        bottom_label_format = %x %X
        time_length = 604800 # 7 days
        aggregate_type = avg
        aggregate_interval = 3600

        [[[weekaqi]]]
            [[[[pm2_5_aqi]]]]

        [[[weekpm2_5]]]
            [[[[pm2_5]]]]

    [[month_images]]
        x_label_format = %d
        bottom_label_format = %x %X
        time_length = 2592000 # 30 days
        aggregate_type = avg
        aggregate_interval = 10800 # 3 hours
        show_daynight = false

        [[[monthaqi]]]
            [[[[pm2_5_aqi]]]]

        [[[monthpm2_5]]]
            [[[[pm2_5]]]]

    [[year_images]]
        # x_label_format is NOT set here: every lang file sets it (en.conf
        # included), and skin.conf is merged back over the lang file, so a
        # value here would shadow the translation.
        bottom_label_format = %x %X
        time_length = 31536000 # 365 days
        aggregate_type = avg
        aggregate_interval = 86400
        show_daynight = false

        [[[yearaqi]]]
            [[[[pm2_5_aqi]]]]

        [[[yearpm2_5]]]
            [[[[pm2_5]]]]

[Generators]
        generator_list = weewx.cheetahgenerator.CheetahGenerator, weewx.imagegenerator.ImageGenerator
