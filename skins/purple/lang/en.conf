# skins/purple/lang/en.conf
#
# English -- the demo report's reference dictionary.  Every string the
# page renders is here, and nothing else: tests/test_purple.py fails if
# a string rendered by index.html.tmpl is missing from this file, or if
# this file carries a string nothing renders.  Every translatable string
# lives here rather than in skin.conf -- skin.conf is merged back OVER the
# lang file, so a label repeated there would shadow its translation.  Do
# NOT add [Units] [[Labels]]: purple.py registers the aqi/aqi_color labels
# in WeeWX's process-global dictionary, which is consulted first, so an
# entry here could never take effect (a test forbids one).
#
# Translations are gettext-style: the English string IS the key, and a
# report falls back to the English, one string at a time, for any key
# its language file does not carry -- a partial translation is fine.

[Labels]

    [[Generic]]

        # Observation labels: the page heading and the y-axis/legend
        # label of the PNG plots.
        pm2_5_aqi = Air Quality Index
        pm2_5     = PM2.5

[ImageGenerator]

    [[year_images]]

        # The US month/day order.  This is the ONLY place it is set --
        # skin.conf carries none, and a test requires that -- so do not
        # delete this line.  A lang file is merged per report, so without
        # it a report set back to lang = en under a non-English
        # [[Defaults]] lang would keep the other language's day-month axis.
        x_label_format = %m/%d

[Texts]

    # ── page strings (index.html.tmpl) ───────────────────────────────
    "weewx-purple demo page" = "weewx-purple demo page"
    "WeeWX-Purple Demo Page" = "WeeWX-Purple Demo Page"
    "Unavailable" = "Unavailable"

    # Plot-period tabs, as in WeeWX's own Seasons skin
    "Day" = "Day"
    "Week" = "Week"
    "Month" = "Month"
    "Year" = "Year"
